name: CI/CD

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}  # contoh: user/backend_datawarehouse_wg

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          echo "TODO: tambahkan pytest di sini"
          # pytest

  build-and-push:
    name: Build & push Docker image (multi-stage)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # hanya untuk push, bukan pull_request
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag by branch
        id: vars
        run: |
          BRANCH="${GITHUB_REF##*/}"
          if [[ "$BRANCH" == "main" ]]; then
            echo "TAG=main-latest" >> $GITHUB_OUTPUT
          else
            echo "TAG=dev-latest" >> $GITHUB_OUTPUT
          fi

      - name: Build and push (multi-stage Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-dev:
    name: Deploy to DEV (self-hosted)
    needs: build-and-push
    runs-on: [self-hosted, development]
    # environment dev → pakai GitHub Environment "development"
    environment:
      name: development
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Log in to GHCR (from DEV runner)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate .env and deploy DEV
        run: |
          cat > .env << EOF
          # ======================
          # APP CONFIG
          # ======================
          HOST_SERVER=${{ vars.HOST_SERVER }}
          PORT_SERVER=${{ vars.PORT_SERVER }}
          ORIGINS=${{ vars.ORIGINS }}

          # ======================
          # SECURITY
          # ======================
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
          ALGORITHM=${{ vars.ALGORITHM }}

          # ======================
          # DATABASE SETTING
          # ======================
          DATABASE_NAME=${{ vars.DATABASE_NAME }}
          DB_HOST=${{ vars.DB_HOST }}
          DB_PORT=${{ vars.DB_PORT }}
          DB_USER=${{ vars.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}

          EOF

          export IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-latest
          docker compose -f compose.dev.yaml pull
          docker compose -f compose.dev.yaml up -d

  deploy-prod:
    name: Deploy to PROD (self-hosted)
    needs: build-and-push
    runs-on: [self-hosted, prod]
    # environment prod → pakai GitHub Environment "production"
    environment:
      name: production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Log in to GHCR (from PROD runner)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate .env and deploy PROD
        run: |
          cat > .env << EOF
          # ======================
          # APP CONFIG
          # ======================
          HOST_SERVER=${{ vars.HOST_SERVER }}
          PORT_SERVER=${{ vars.PORT_SERVER }}
          ORIGINS=${{ vars.ORIGINS }}

          # ======================
          # SECURITY
          # ======================
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
          ALGORITHM=${{ vars.ALGORITHM }}

          # ======================
          # DATABASE 1
          # ======================
          DATABASE_NAME=${{ vars.DATABASE_NAME }}
          DB_HOST=${{ vars.DB_HOST }}
          DB_PORT=${{ vars.DB_PORT }}
          DB_USER=${{ vars.DB_USER }}
          DB_PASSWORD=${{ secrets.DB1_PASSWORD }}

          EOF

          export IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main-latest
          docker compose -f compose.prod.yaml pull
          docker compose -f compose.prod.yaml up -d